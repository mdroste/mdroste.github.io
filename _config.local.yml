# Applied only by bin/preview; production continues to use _config.yml.
url: "http://localhost:4000"
baseurl: ""
enable_google_analytics: false
enable_panelbear_analytics: false

# Keep development builds independent of third-party blog feeds and image tools.
external_sources: []
imagemagick:
  enabled: false

# Jekyll replaces this list rather than merging it with _config.yml.
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - _posts/2020-09-28-twitter.md
  - _posts/2021-07-04-diagrams.md
